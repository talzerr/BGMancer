apiVersion: apps/v1
kind: Deployment
metadata:
  name: bgmancer
  labels:
    app: bgmancer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bgmancer
  # Recreate, not RollingUpdate: the rate limiter and generation cooldown live
  # in-process (see src/lib/rate-limit.ts), so the app is only correct at one
  # replica. A rolling update would briefly run two pods with divergent
  # counters, letting a caller exceed the limit by talking to the new pod.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: bgmancer
    spec:
      containers:
        - name: app
          image: bgmancer:dev
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: bgmancer-config
            - secretRef:
                name: bgmancer-secrets
            - secretRef:
                name: bgmancer-db
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
